name: Markdown lint

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-lint.yml"
  pull_request:
    paths:
      - "**/*.md"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !**/CHANGELOG.md
            !LICENSE
        continue-on-error: true
